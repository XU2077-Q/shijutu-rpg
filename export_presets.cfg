; 导出预设。
;
; 【Web 是第一个做的，虽然它最后上架用不着】
; 它在整个工程里排第一不是因为它重要，而是因为它**离玩家最近** ——
; 一个链接，点开就能玩，不用装东西、不用过审。每个里程碑都导一次挂上去，
; 你验收的成本是零。Windows 和 Android 排到里程碑 7。
;
; 【thread_support 必须是 false】
; 开了线程支持的 Web 包要求服务端发 COOP/COEP 两个响应头（SharedArrayBuffer
; 的前提），而 GitHub Pages **发不了自定义响应头**。开了的话，包在本地能跑，
; 挂上 Pages 就是一个白屏 —— 而且浏览器的报错信息指向 SharedArrayBuffer，
; 跟「你没配响应头」这件事隔了十万八千里。
;
; 【vram_texture_compression 两个都关】
; 开了会把立绘压成 S3TC/ETC，那是给 3D 贴图用的，边角会出块状伪影。
; 这游戏的立绘是水墨，软边一压就脏。宁可包大一点 —— 五十几兆而已，
; 换一张干净的脸。
;
; 【exclude_filter 排掉 tools/】
; 里面有方舟的接口封装和美术工单。工单是给构建用的，不该进玩家的包。

